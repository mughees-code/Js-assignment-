
<!DOCTYPE html>

<body>

<h1>JavaScript Practical Assignment</h1>
<p>Assignment 01 - Beginner Level</p>

<script>

// Task 01
let name = prompt("Enter your name:");
let age = prompt("Enter your age:");
let city = prompt("Enter your city:");

alert("My name is " + name + ".\n" +
      "I am " + age + " years old.\n" +
      "I live in " + city + ".");

// Task 02
let birthYear = prompt("Enter your birth year:");
let currentYear = 2026;
let userAge = currentYear - Number(birthYear);

alert("Your birth year is " + birthYear + ".\n" +
      "Your age is " + userAge + ".");

// Task 03
let num1 = prompt("Enter first number:");
let num2 = prompt("Enter second number:");

let sum = Number(num1) + Number(num2);

alert("First Number: " + num1 + "\n" +
      "Second Number: " + num2 + "\n" +
      "Sum is: " + sum);

</script>
